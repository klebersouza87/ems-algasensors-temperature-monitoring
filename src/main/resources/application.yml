server:
  port: '8082'

spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: temperature-monitoring
  datasource:
    username: sa
    #AUTO_SERVER allows multiple connections to the same database file
    url: jdbc:h2:file:~/algasensors-temperature-monitoring-db;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    #This password is only for tests. In real word, never set password here. Use a vault or secret instead.
    password: '123'
  h2:
    console:
      enabled: 'true'
      settings.web-allow-others: 'true'
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      #Change to create-drop in case of changes in schema
      ddl-auto: update
    show-sql: 'true'
  rabbitmq:
    host: localhost
    port: 5672
    username: rabbitmq
    password: rabbitmq
    listener:
      simple:
        #process up to 4 messages concurrently
        prefetch: 4
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 10s
          multiplier: 2
          max-interval: 20s